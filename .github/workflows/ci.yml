name: CI

on:
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install lint and format tools
        run: npm install --global eslint@10.2.1 prettier@3.8.3

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
